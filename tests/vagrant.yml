# test file
---
- name: converge
  hosts: all
  remote_user: vagrant
  become: true
  roles:
    - role: ../../
      when: >
        false
        or (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] is version('10', '>='))
        or (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] is version('18', '>='))
  vars:
    netplan_conf_file: 01-netcfg.yaml
    netplan_conf: |
      network:
        version: {{ netplan_version }}
        renderer: {{ netplan_renderer }}
        ethernets:
          {{ hostvars[inventory_hostname]['ansible_facts'][(ansible_facts['interfaces'] | difference(['lo']) | sort | list | first)]['device'] }}:
            dhcp4: true
          {{ hostvars[inventory_hostname]['ansible_facts'][(ansible_facts['interfaces'] | difference(['lo']) | sort | list | last)]['device'] }}:
            addresses:
            - {{ hostvars[inventory_hostname]['ansible_facts'][(ansible_facts['interfaces'] | difference(['lo']) | sort | list | last)]['ipv4']['address'] }}/24
    netplan_conf_purge: true
